[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "visual-coding-agent-harness"
version = "0.1.0"
description = "A lightweight visual coding-agent harness for multimodal tool-use research."
requires-python = ">=3.9"
dependencies = []

[project.scripts]
vh-eval-videomme = "visual_coding_agent_harness.cli.eval_videomme:main"
vh-run-ablation = "visual_coding_agent_harness.cli.run_ablation:main"
vh-ablation-report = "visual_coding_agent_harness.cli.generate_ablation_report:main"
vh-audit-trajectory = "visual_coding_agent_harness.cli.audit_trajectory:main"
vh-trajectory-markdown = "visual_coding_agent_harness.cli.trajectory_markdown:main"

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]
